# =================================================================================================
# Exports rules and settings from GitHub's internal configuration into '.github/rulesets' and
# '.github/settings.json'. Only triggered manually, which should be done following every manual
# configuration change.
# =================================================================================================

name: Export Rulesets

on:
  workflow_dispatch:
  workflow_call:

# Cancel in-progress runs when starting a new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      REPO_DIR: repo
      RULESETS_DIR: repo/.github/rulesets
      SETTINGS_FILE: repo/.github/settings.json

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check requirements
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN secret is not set." \
              "Create a GitHub Personal Access Token with sufficient access" \
              "and add it as a repository secret named GH_TOKEN."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout github-rules
        uses: actions/checkout@v4
        with:
          repository: SgtSwagrid/github-rules
          path: github-rules

      - name: Sync Rulesets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash github-rules/scripts/export-rulesets.sh

      - name: Sync Settings
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash github-rules/scripts/export-settings.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
          UPDATE_BRANCH: ci/export-rulesets
          PR_TITLE: "[github-rules] Exported GitHub rulesets to source."
          PR_BODY_FILE: github-rules/templates/pull-request-body.md
        run: bash github-rules/scripts/publish.sh
